<!DOCTYPE html>
<!-- This Source Code Form is subject to the terms of the Mozilla Public
     License, v. 2.0. If a copy of the MPL was not distributed with this
     file, You can obtain one at https://mozilla.org/MPL/2.0/. -->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>ChatGPT vs Gemini</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <header class="topbar">
    <button type="button" id="btn-menu" class="icon-btn" data-i18n-title="menu" data-i18n-aria="menu" title="メニュー" aria-label="メニュー">☰</button>
    <h1 class="app-title">
      <span class="t-gpt">CHATGPT</span><span class="t-vs">vs</span><span class="t-gem">GEMINI</span>
    </h1>
    <div class="leds">
      <span class="led-group"><span id="led-chatgpt" class="led"></span><span class="led-label">ChatGPT</span><span id="guest-chatgpt" class="guest-tag hidden" data-i18n="guest" data-i18n-title="guest.title" title="ログインなしで利用中">ゲスト</span></span>
      <span class="led-group"><span id="led-gemini" class="led"></span><span class="led-label">Gemini</span><span id="guest-gemini" class="guest-tag hidden" data-i18n="guest" data-i18n-title="guest.title" title="ログインなしで利用中">ゲスト</span></span>
      <span class="led-group"><span id="led-runner" class="led st-idle"></span><span id="runner-state-label" class="led-label">idle</span></span>
    </div>
    <div class="turns">
      <span class="turns-label">TURN</span>
      <span id="turn-now">0</span><span class="turns-sep">/</span><span id="turn-max">–</span>
    </div>
    <select id="lang-select" class="ctl-select lang-select" data-i18n-title="lang.title" title="言語(画面・ログ・プロンプト)" aria-label="Language">
      <option value="ja">日本語</option>
      <option value="en">English</option>
    </select>
    <button type="button" id="btn-transcript" class="view-toggle" data-i18n-title="view.toggle.title" title="ライブ表示と経過表示を切り替え">経過</button>
  </header>

  <div class="controls">
    <textarea id="topic-input" rows="2" data-i18n-placeholder="topic.placeholder" placeholder="議論テーマを入力…(複数行可。Ctrl+Enter で開始)" autocomplete="off" spellcheck="false"></textarea>
    <div class="controls-side">
    <div class="controls-row">
    <label class="turns-field" data-i18n-title="first.title" title="先に発言する AI(この議論だけ。既定は設定の「先攻」)"><span class="turns-label-inline" data-i18n="first.label">先攻</span>
      <select id="ctl-first-speaker" class="ctl-select" data-i18n-aria="first.label" aria-label="先攻">
        <option value="chatgpt">ChatGPT</option>
        <option value="gemini">Gemini</option>
      </select>
    </label>
    <span class="turns-field" data-i18n-title="turns.title" title="最大ターン数(▲▼で変更)"><span class="turns-label-inline" data-i18n="turns.label">ターン</span>
      <span class="stepper">
        <input id="ctl-max-turns" type="text" readonly tabindex="-1" data-i18n-aria="turns.aria" aria-label="最大ターン数">
        <span class="spin">
          <button type="button" id="ctl-turns-up" class="spin-btn" data-i18n-aria="turns.up" aria-label="ターン数を増やす" tabindex="-1">▲</button>
          <button type="button" id="ctl-turns-down" class="spin-btn" data-i18n-aria="turns.down" aria-label="ターン数を減らす" tabindex="-1">▼</button>
        </span>
      </span>
    </span>
    </div>
    <div class="controls-row">
    <button type="button" id="btn-start"  class="btn btn-start" data-i18n="btn.start" data-i18n-title="btn.start.title" title="議論を開始(Ctrl+Enter)" disabled>開始</button>
    <button type="button" id="btn-pause"  class="btn" data-i18n="btn.pause" disabled>一時停止</button>
    <button type="button" id="btn-resume" class="btn" data-i18n="btn.resume" disabled>再開</button>
    <button type="button" id="btn-stop"   class="btn btn-stop" data-i18n="btn.stop" disabled>停止</button>
    </div>
    </div>
  </div>

  <div id="login-banner" class="login-banner hidden" role="status">
    <span class="lb-icon" aria-hidden="true"></span>
    <span id="login-banner-text" class="lb-text"></span>
    <span id="login-banner-hint" class="lb-hint"></span>
    <button type="button" id="login-banner-close" class="lb-close" data-i18n-title="close" data-i18n-aria="close" title="閉じる" aria-label="閉じる">✕</button>
  </div>

  <main id="feed" class="feed" aria-live="polite"></main>

  <div id="backdrop" class="backdrop"></div>

  <aside id="drawer" class="drawer" data-i18n-aria="drawer.aria" aria-label="管理メニュー">
    <nav class="drawer-tabs">
      <button type="button" class="drawer-tab active" data-tab="settings" data-i18n="tab.settings">設定</button>
      <button type="button" class="drawer-tab" data-tab="history" data-i18n="tab.history">履歴</button>
      <button type="button" class="drawer-tab" data-tab="search" data-i18n="tab.search">検索</button>
      <button type="button" id="btn-drawer-close" class="icon-btn" data-i18n-title="close" data-i18n-aria="close" title="閉じる" aria-label="閉じる">✕</button>
    </nav>

    <section id="panel-settings" class="drawer-panel">
      <form id="settings-form">
        <div class="set-grid">
          <label class="field"><span data-i18n="set.maxTurns">最大ターン数</span>
            <input id="set-max-turns" type="number" min="1" max="99" step="1"></label>
          <label class="field"><span data-i18n="set.firstSpeaker">先攻</span>
            <select id="set-first-speaker">
              <option value="chatgpt">ChatGPT</option>
              <option value="gemini">Gemini</option>
            </select></label>
          <label class="field"><span data-i18n="set.betweenTurns">ターン間隔 (ms)</span>
            <input id="set-between-turns" type="number" min="0" step="500"></label>
          <label class="field"><span data-i18n="set.poll">ポーリング (ms)</span>
            <input id="set-poll" type="number" min="100" step="100"></label>
          <label class="field"><span data-i18n="set.stability">安定判定 (ms)</span>
            <input id="set-stability" type="number" min="500" step="500"></label>
          <label class="field"><span data-i18n="set.timeout">タイムアウト (ms)</span>
            <input id="set-timeout" type="number" min="1000" step="1000"></label>
          <label class="field"><span data-i18n="set.adminRatio">管理ペイン比 (0-1)</span>
            <input id="set-admin-ratio" type="number" min="0" max="1" step="0.05"></label>
          <label class="field"><span data-i18n="set.chatSplit">ChatGPT 幅比 (0-1)</span>
            <input id="set-chat-split" type="number" min="0" max="1" step="0.05"></label>
          <label class="field"><span data-i18n="set.chatZoom">チャット表示倍率 (0.25-3)</span>
            <input id="set-chat-zoom" type="number" min="0.25" max="3" step="0.05"></label>
          <div class="field field-wide set-note" id="set-templates-note"></div>
          <label class="field field-wide"><span data-i18n="set.opening">開始テンプレート {topic} {opponent}</span>
            <textarea id="set-opening" rows="3" spellcheck="false"></textarea></label>
          <label class="field field-wide"><span data-i18n="set.counter">反論テンプレート {topic} {opponent} {message}</span>
            <textarea id="set-counter" rows="3" spellcheck="false"></textarea></label>
          <label class="field field-wide"><span data-i18n="set.relay">中継テンプレート {opponent} {message}</span>
            <textarea id="set-relay" rows="3" spellcheck="false"></textarea></label>
        </div>
        <div class="save-row">
          <button type="submit" id="btn-save-settings" class="btn btn-save" data-i18n="set.save">保存</button>
          <span id="save-flash" data-i18n="set.saved">保存しました</span>
        </div>
      </form>
    </section>

    <section id="panel-history" class="drawer-panel hidden">
      <div id="history-list"></div>
      <div id="history-detail" class="hidden">
        <div class="hist-head">
          <button type="button" id="btn-history-back" class="btn btn-small" data-i18n="history.back">← 一覧</button>
          <span id="history-title" class="hist-title"></span>
        </div>
        <div id="history-messages"></div>
      </div>
    </section>

    <section id="panel-search" class="drawer-panel hidden">
      <input id="search-input" type="search" data-i18n-placeholder="search.placeholder" placeholder="全文検索…" autocomplete="off" spellcheck="false">
      <div id="search-results"></div>
    </section>
  </aside>

  <div id="pane-divider" data-i18n-title="divider.title" title="ドラッグで管理ペインとチャットペインの比率を変える" role="separator" aria-orientation="horizontal"></div>

  <script type="module" src="./renderer.js"></script>
</body>
</html>
