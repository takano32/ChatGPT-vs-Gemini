<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- ChatGPT vs Gemini のアプリアイコン(ソース)。build/icon.png はこのファイルから生成する:
       rsvg-convert -w 1024 -h 1024 build/icon.svg -o build/icon.png
       macOS の HIG に合わせ、角丸正方形(824px)を 1024 キャンバスの中央に置き周囲は透明にする。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151b30"/>
      <stop offset="1" stop-color="#0b0f1c"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2fd39a"/>
      <stop offset="1" stop-color="#0e9f73"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6aa6ff"/>
      <stop offset="1" stop-color="#7b5cf0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <!-- 左: ChatGPT の吹き出し(緑) -->
  <g filter="url(#shadow)">
    <path d="M236 300 h330 a64 64 0 0 1 64 64 v176 a64 64 0 0 1 -64 64 h-150 l-96 88 v-88 h-84 a64 64 0 0 1 -64 -64 v-176 a64 64 0 0 1 64 -64 z" fill="url(#green)"/>
  </g>
  <!-- 右: Gemini の吹き出し(青→紫)。左の上に重ねて対話を表す -->
  <g filter="url(#shadow)">
    <path d="M458 420 h330 a64 64 0 0 1 64 64 v176 a64 64 0 0 1 -64 64 h-84 v88 l-96 -88 h-150 a64 64 0 0 1 -64 -64 v-176 a64 64 0 0 1 64 -64 z" fill="url(#blue)" stroke="#0b0f1c" stroke-width="14"/>
  </g>
  <!-- 吹き出しの中の「点」: 発言中を示す 3 点 -->
  <g fill="#ffffff" opacity="0.95">
    <circle cx="300" cy="404" r="22"/><circle cx="368" cy="404" r="22"/><circle cx="436" cy="404" r="22"/>
  </g>
  <g fill="#ffffff" opacity="0.95">
    <circle cx="556" cy="572" r="22"/><circle cx="624" cy="572" r="22"/><circle cx="692" cy="572" r="22"/>
  </g>
</svg>
