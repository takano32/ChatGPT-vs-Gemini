# electron-builder(v26)の設定。
# 表示名は package.json の productName(ChatGPT vs Gemini)。userData もそこから決まる(Electron の慣習)。
# 機械用の識別子(npm name / Linux 実行ファイル名 / deb・rpm パッケージ名)は chatgpt-vs-gemini。
# CI(.github/workflows/build.yml)は形式とアーキを CLI で指定して並列に作る。ここの target は
# ローカルの `npm run dist` 用の既定。Release への添付は CI の最終ジョブが gh で行う。
appId: io.github.takano32.ChatGPTvsGemini

directories:
  output: release   # 既定の dist/ は tsc の出力先と衝突する

files:
  - dist/**
  - "!dist/**/*.map"
  - package.json

# better-sqlite3 v13 は Node-API のプリビルドを同梱しており再ビルド不要。
# 既定の再ビルドは node-gyp を起動するだけ(ツールチェーン依存)なので切る。
npmRebuild: false

mac:
  category: public.app-category.utilities
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]

win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
    - target: msi   # 同梱の WiX が arm64 未対応のため x64 のみ
      arch: [x64]

linux:
  category: Utility
  synopsis: ChatGPT と Gemini を議論させるデスクトップアプリ
  # .desktop のファイル名と StartupWMClass を package.json の desktopName(Electron の app_id)に揃える
  syncDesktopName: true
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64, arm64]
    - target: pacman
      arch: [x64, arm64]
    - target: tar.gz
      arch: [x64, arm64]

deb:
  packageCategory: utils
