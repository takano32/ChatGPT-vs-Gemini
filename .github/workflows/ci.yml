# push / PR ごとに build.yml の全ジョブ(OS × アーキ + Linux の形式別)を並列に走らせ、全形式を作って起動スモーク。
# Artifacts に残すのは main への push と手動実行だけ(7 日間)。PR は作るだけ。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      upload: ${{ github.event_name != 'pull_request' }}
      retention-days: 7
