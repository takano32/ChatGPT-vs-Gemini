# push / PR ごとに 6 ターゲット(OS × アーキ)を並列にビルドして起動スモーク。
# PR は unpacked とスモークだけ、main への push と手動実行は全形式を Artifacts に 7 日間残す。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      full: ${{ github.event_name != 'pull_request' }}
      retention-days: 7
