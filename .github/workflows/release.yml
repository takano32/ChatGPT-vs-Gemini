# v* タグの push で 6 ターゲットを並列ビルドし、最後の 1 ジョブが全部集めて draft Release を作る
# (公開は人が行う)。手動実行(workflow_dispatch)ではビルドと Artifacts だけで Release には触らない。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      full: true
      retention-days: 14

  publish:
    name: draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist-artifacts
          merge-multiple: true
      - name: Create the draft release with every distributable attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist-artifacts
          gh release create "$GITHUB_REF_NAME" dist-artifacts/* \
            --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
