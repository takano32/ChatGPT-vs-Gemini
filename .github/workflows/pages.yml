# docs/ を GitHub Pages に配信する(配布サイト)。ページは GitHub Releases API で最新版を表示するので、
# リリースのたびに更新する必要はない。
# actions はメジャータグ、Node は lts/*、ランナーは *-latest で最新に追従する(メジャー更新時だけ手で上げる)。
name: Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
