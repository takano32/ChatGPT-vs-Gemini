# 共通ビルド(ci.yml / release.yml から呼ぶ)。Release には触らず Artifacts に置くだけ。
# ランナーはバージョンを書かない *-latest の 3 種だけを使い、もう片方のアーキはクロスビルドする
# (Electron も better-sqlite3 も配布済みバイナリなのでツールチェーン不要)。
# PR でも全形式を作る(Dependabot の electron / electron-builder 更新で配布物の段階だけが壊れるのを
# マージ前に見つけるため)。Artifacts への保存だけ upload 入力で制御する。
# - build:          OS × アーキの 5 ジョブ。パッケージ化 → 認証なし起動スモーク(scripts/smoke.mjs)。
#                   スモークはランナーのアーキと一致するジョブでだけ動く(x64 Linux/Windows、arm64 mac)。
#                   Linux はここでは AppImage と tar.gz だけ作る。
#                   Windows は 1 ジョブで両アーキを作る: electron-builder の NSIS / portable は両アーキ入りの
#                   1 ファイルを作る設計で、アーキ別に別プロセスで作ると同名ファイルが衝突する。
# - linux-packages: deb / rpm / pacman × 2 アーキの 6 ジョブ。electron-builder はこれらを
#                   1 プロセス内で直列に作り圧縮が律速になるため、形式ごとに分けて並列化している。
#                   1 アーキ 1 ジョブに戻すときは、このジョブを消して build の Linux 行の targets に
#                   "deb rpm pacman" を足すだけでよい。
# actions はメジャータグ、Node は lts/*、ランナーは最新に追従する(メジャー更新時だけ手で上げる)。
name: Build

on:
  workflow_call:
    inputs:
      upload:
        description: 成果物を Artifacts に残す(PR では false)
        type: boolean
        default: true
      retention-days:
        type: number
        default: 7

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # args は electron-builder にそのまま渡す。arch はスモークをランナーのアーキと照合するためだけに使う。
          - { name: linux-x64,   os: ubuntu-latest,  args: --linux AppImage tar.gz --x64,   arch: x64 }
          - { name: linux-arm64, os: ubuntu-latest,  args: --linux AppImage tar.gz --arm64, arch: arm64 }
          - { name: mac-arm64,   os: macos-latest,   args: --mac dmg zip --arm64,           arch: arm64 }
          - { name: mac-x64,     os: macos-latest,   args: --mac dmg zip --x64,             arch: x64 }
          - { name: windows,     os: windows-latest, args: --win,                           arch: x64 }  # 形式とアーキは electron-builder.yml の win.target どおり(msi は x64 のみ)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install Xvfb for the smoke test
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Build distributables
        run: npx electron-builder ${{ matrix.args }} --publish never
      # クロスビルドしたアーキは起動できないので、ランナーのアーキと一致するときだけスモークを走らせる
      - name: Smoke test (Linux, under Xvfb)
        if: runner.os == 'Linux' && ((matrix.arch == 'x64' && runner.arch == 'X64') || (matrix.arch == 'arm64' && runner.arch == 'ARM64'))
        run: xvfb-run -a node scripts/smoke.mjs
      - name: Smoke test
        if: runner.os != 'Linux' && ((matrix.arch == 'x64' && runner.arch == 'X64') || (matrix.arch == 'arm64' && runner.arch == 'ARM64'))
        run: node scripts/smoke.mjs
      - uses: actions/upload-artifact@v7
        if: inputs.upload
        with:
          name: ${{ matrix.name }}
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.msi
            release/*.AppImage
            release/*.tar.gz

  linux-packages:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64-deb,      arch: x64,   target: deb,    apt: "" }
          - { name: linux-x64-rpm,      arch: x64,   target: rpm,    apt: rpm }
          - { name: linux-x64-pacman,   arch: x64,   target: pacman, apt: libarchive-tools }
          - { name: linux-arm64-deb,    arch: arm64, target: deb,    apt: "" }
          - { name: linux-arm64-rpm,    arch: arm64, target: rpm,    apt: rpm }
          - { name: linux-arm64-pacman, arch: arm64, target: pacman, apt: libarchive-tools }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install packaging tool (${{ matrix.apt }})
        if: matrix.apt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.apt }}
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --linux ${{ matrix.target }} --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v7
        if: inputs.upload
        with:
          name: ${{ matrix.name }}
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
          path: release/*.${{ matrix.target }}
